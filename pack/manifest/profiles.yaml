# DrewCraft development / compatibility profiles
#
# Profiles select entries from the companion candidate registries. They are
# development inputs, NOT production release locks. The Stage 1 resolver should
# resolve a profile into a deterministic dependency graph, then exact hashes and
# compatibility gates decide what is promoted to future mods.yaml/content-packs.yaml.

schema_version: 1
last_updated: "2026-09-13"

target:
  minecraft: "1.21.1"
  loader: "neoforge"
  java: 21

registries:
  foundation: "pack/manifest/upstreams.yaml"
  performance: "pack/manifest/performance_candidates.yaml"
  gameplay_spikes: "pack/manifest/mob_structure_candidates.yaml"
  runtime_libraries: "pack/manifest/runtime_candidates.yaml"
  radar_integrations: "pack/manifest/radar_candidates.yaml"
  create_combat_mobility: "pack/manifest/create_combat_mobility_candidates.yaml"

profiles:
  stage2_base_performance:
    description: "Foundational DrewCraft stack plus conservative performance baseline and the V1 physical radar frontend."
    foundation:
      - terrain_diffusion_plus
      - chunky
      - distant_horizons
      - create
      - create_radars
      - immersive_vehicles
      - mts_official_pack
      - project_atmosphere
      - simple_clouds
      - serene_seasons
      - glitchcore
      - gabous_libs
    performance_baseline:
      - modernfix
      - ferritecore
      - lithium
      - servercore
      - scalablelux
      - chunk_sending
      - alltheleaks
      - fastsuite
      - fastworkbench
      - fastfurnace
      - clumps
      - connectivity
      - spark
      - embeddium
      - immediatelyfast
      - entity_culling
      - moreculling
    performance_libraries:
      - placebo
      - cupboard
      - architectury
    config_policy:
      - "Use semantics-preserving optimizer defaults first."
      - "ServerCore entity activation/dynamic distance/mobcap changes disabled until separately tested."
      - "No C2ME in this profile."
      - "No tactical horde/herd AI or source-structure pack in this profile."
      - "Architectury is a required transitive of Gabou's Libs / Project Atmosphere, discovered by the dedicated-server smoke test."
      - "Create: Radars is the V1 physical radar frontend; DrewCraft extends it externally rather than forking or duplicating its hardware/network stack."
    gate: "Pass the foundational + performance matrix and final V1 full-stack acceptance before release promotion."

  stage2_create_combat_mobility:
    extends:
      - stage2_base_performance
    create_expansion_components:
      - create_big_cannons
      - create_gunsmithing
      - create_aeronautics
      - create_high_seas
    create_expansion_libraries:
      - sable
      - ntgl
      - geckolib
      - playeranimator
      - ritchies_projectile_library
    purpose: "Selected V1 Create combat + block-built vehicle/ship stack. Keeps MTS as practical conventional transport while adding engineered airships/ships, handheld firearms and structural artillery."
    requirements:
      - "Resolve exact provider artifact and SHA-256 for every component/transitive before lock."
      - "Dedicated server must pass fresh-world boot + same-world restart with the entire profile."
      - "Windows and Apple Silicon clients must pass join/render/control tests."
      - "Sable sub-level assembly, movement, chunk crossing, unload/reload and server restart must not duplicate/corrupt entities or blocks."
      - "MTS cars/trucks/aircraft must coexist with Aeronautics without control/keybind/entity conflicts."
      - "Create Big Cannons must work on static emplacements first; moving-platform artillery is a later acceptance gate."
      - "NTGL/Gunsmithing projectiles must collide correctly with Sable sub-levels."
      - "CBC projectiles must collide correctly with Sable sub-levels."
      - "High Seas buoyancy/flooding/list/trim state must survive unload/reload and restart."
      - "Representative armed ship/airship stress test must have acceptable MSPT/network behavior before survival support."
      - "Set conservative heavy-artillery block-damage defaults before production survival."
    explicit_deferments:
      - create_weaponry
      - create_caliber
      - clockwork_valkyrien_skies
      - drewcraft_night_optics
      - spotlight_stack
    gate: "Pass the Create combat/mobility interaction matrix before these candidates enter the production lock."

  covenant_endgame_spike:
    extends:
      - stage2_base_performance
    gameplay_components:
      - illager_invasion
      - puzzles_lib
    overlays:
      - pack/overlays/covenant_endgame_spike
    purpose: "Covenant cult tactical roster spike. DrewCraft owns strategic spawning, composition, lore drops, Source Cores and sieges; Illager Invasion supplies local mob behavior only."
    requirements:
      - "Disable native Illager Invasion raids (all participateInRaids=false) so no second strategic authority exists."
      - "Suppress or explicitly retain patrol-mixin marauder spawns, native structures/worldgen and loot injects via datapack audit."
      - "Materialize every cult entity through DrewCraft strategic state with tagged encounters and idempotent casualties."
      - "Boot dedicated server fresh-world + same-world restart with the full profile before promotion."
    gate: "Pass the endgame production gates in pack/manifest/endgame_content.yaml before these candidates enter the production lock."

  playtest_01:
    extends:
      - stage2_create_combat_mobility
      - covenant_endgame_spike
      - source_structures_first_spike
    exclude_dependencies:
      - embeddium
      - scalablelux
    purpose: "playtest-0.1 pack (owner decision C13): full Create combat/mobility stack + Covenant cult roster + natural source structures on the certified base. No SSH/host work included."
    gate: "Fresh-world boot + same-world restart + client join on all three OS targets before any human session."

  hostile_ai_enhanced_hordes:
    extends:
      - stage2_base_performance
    gameplay_components:
      - enhanced_hordes
      - enhanced_hordes_tweaks
    purpose: "Loaded strategic-hostile cooperation/wandering/stacking spike."
    requirements:
      - "Disable/avoid spawning or reinforcement that creates strategic strength outside DrewCraft."
      - "Disable/restrict generic block breaking for strategic groups so DrewCraft siege ownership remains intact."
      - "Verify externally materialized/tagged mobs participate correctly."
    incompatible_profiles:
      - hostile_ai_zombie_hordes

  hostile_ai_zombie_hordes:
    extends:
      - stage2_base_performance
    gameplay_components:
      - zombie_hordes
    purpose: "Alternative loaded horde behavior spike."
    requirements:
      - "Disable/avoid strategic-strength creation outside DrewCraft accounting."
      - "Verify stacking/cooperation with materialized strategic entities."
    incompatible_profiles:
      - hostile_ai_enhanced_hordes

  herd_ai_ethological:
    extends:
      - stage2_base_performance
    gameplay_components:
      - ethological
    purpose: "Rich loaded wild-herd behavior spike."
    requirements:
      - "DrewCraft remains authoritative for HerdRecord/unloaded movement/materialization."
      - "Verify player-owned/named/leashed/bred/penned animals are not absorbed into strategic wild-herd state."
      - "Measure CPU cost for large materialized herds."
    incompatible_profiles:
      - herd_ai_instinct

  herd_ai_instinct:
    extends:
      - stage2_base_performance
    gameplay_components:
      - herd_instinct
    purpose: "Narrow shared-panic herd behavior fallback."
    requirements:
      - "DrewCraft remains authoritative for HerdRecord/unloaded movement/materialization."
    incompatible_profiles:
      - herd_ai_ethological

  source_structures_first_spike:
    extends:
      - stage2_base_performance
    vanilla_controls:
      - minecraft:pillager_outpost
    gameplay_components:
      - towns_and_towers
      - when_dungeons_arise
    gameplay_libraries:
      - cristel_lib
    overlays:
      - pack/overlays/source_structures_first_spike
    worldgen_policy:
      - "Towns and Towers villages remain friendly/neutral unless explicitly mapped otherwise."
      - "Generate only explicitly allow-listed WDA structures; disable every other WDA structure."
      - "Every enabled WDA structure remains an explorable dungeon with its intended mobs and loot and also becomes a DrewCraft strategic source."
      - "Use pack-owned structure enable/spacing/separation configuration first."
      - "Increase source spacing aggressively for Terrain Diffusion World Scale 2."
      - "Pregenerate a disposable representative region and produce structure/source density counts before promotion."
    source_mappings:
      minecraft:pillager_outpost: CAMP
      towns_and_towers:towers_structure_set: CAMP
      dungeons_arise:illager_campsite: CAMP
      dungeons_arise:illager_fort: FORT
      dungeons_arise:bandit_towers: FORT
      dungeons_arise:plague_asylum: RUIN
      dungeons_arise:shiraz_palace: CITY
    notes:
      - "Exact Towns and Towers tower IDs are enumerated in world/source-mappings.json."
      - "WDA 2.1.68 incorrectly caps its Minecraft dependency below 1.21.1; the profile overlay uses FML's supported dependency override and compatibility remains a runtime gate."
      - "Every promoted source structure receives DrewCraft SourceRecord + Source Core semantics; the structure mod never owns strategic state."

  source_structures_ctov_alternative:
    extends:
      - stage2_base_performance
    gameplay_components:
      - ctov
    gameplay_libraries:
      - lithostitched
    purpose: "Alternative village/outpost branch to compare against Towns and Towers."
    incompatible_profiles:
      - source_structures_first_spike
    notes:
      - "Do not stack CTOV with Towns and Towers by default. Compare style, density, Terrain Diffusion placement and maintenance surface first."

  source_density_sparse_structures_spike:
    extends:
      - source_structures_first_spike
    gameplay_components:
      - sparse_structures
    purpose: "Evaluate global structure spacing only if pack-owned per-structure controls are insufficient or cumbersome."
    notes:
      - "Not preferred if exact pack-owned spacing gives sufficient control."

  worldbuild_c2me_spike:
    extends:
      - stage2_base_performance
    experimental_performance:
      - c2me_neoforge
    purpose: "Disposable offline pregeneration benchmark/correctness branch."
    deployment: worldbuild_only_until_promoted
    requirements:
      - "Run same seed/config without C2ME as control."
      - "Compare Terrain Diffusion output and structure placement."
      - "Inspect thread/worldgen warnings."
      - "Repeatedly restart/reload generated chunks."
      - "Record chunks/sec, CPU, heap/native memory and wall time."
      - "Reject on corruption/nondeterminism even if faster."

  worldbuild_structure_essentials_spike:
    extends:
      - source_structures_first_spike
    experimental_performance:
      - structure_essentials
    purpose: "Evaluate structure locating/spacing/overlap/debug tooling during world build and source indexing."
    deployment: worldbuild_or_server_admin_only_if_useful

rules:
  - "Profiles may extend the baseline, but mutually exclusive profiles must never be merged silently."
  - "All selected dependencies must resolve transitively and receive exact SHA-256 before lock."
  - "A candidate profile passing once does not imply production promotion; record evidence and rerun affected gates after updates."
  - "Production release manifests contain promoted exact dependencies, not references to mutable candidate profiles."
