  stuff_additions_sable_aeronautics_compat:
    display_name: "Create Stuff 'N Additions x Sable & Aeronautics Compat"
    kind: compatibility_mod
    side: common
    provider: modrinth
    project_id: gsAqDfOu
    version_id: oOYLBz7M
    candidate_version: "1.0.3"
    filename: "SableStuffAdditionsCompat v1.0.3-1.21.1.jar"
    download_url: "https://cdn.modrinth.com/data/gsAqDfOu/versions/oOYLBz7M/SableStuffAdditionsCompat%20v1.0.3-1.21.1.jar"
    release_status: release
    required_dependencies:
      - create_stuff_additions
      - create_aeronautics
      - sable
    role: "Fixes jetpack/grappling/block-picker behavior on Aeronautics/Sable moving sublevels."
    worldgen_resources: false

compatibility_gates:
  - "Exact provider artifacts and SHA-256 evidence resolve deterministically."
  - "Fresh dedicated-server boot and same-world restart pass."
  - "Existing production world loads without regeneration or missing-registry failures."
  - "C&A rolling mill/wires work on static Create builds and Sable sublevels."
  - "Bioethanol reaches an MTS fuel pump/tank and powers gasoline/avgas engines."
  - "MTS vehicles remain final-assembled through MTS workbenches."
  - "Steam 'n' Rails trains survive long chunk crossings, unload/reload and restart."
  - "Enchantment Industry has no XP duplication path."
  - "Stuff 'N Additions equipment does not invalidate MTS aircraft or normal survival."
  - "Lootr converts/handles representative WDA loot containers and preserves per-player state across restart."
