    display_name: "Create: Dragons Plus"
    kind: create_addon_library
    side: common
    provider: modrinth
    project_id: dzb1a5WV
    version_id: PsnDvjPV
    candidate_version: "1.11.4"
    filename: "CreateDragonsPlus-1.11.4.jar"
    download_url: "https://cdn.modrinth.com/data/dzb1a5WV/versions/PsnDvjPV/CreateDragonsPlus-1.11.4.jar"
    release_status: release
    required_dependencies:
      - create
    required_by:
      - create_enchantment_industry
    worldgen_resources: false

  create_additions_sable_compat:
    display_name: "Create Additions - Sable Compat"
    kind: compatibility_mod
    side: common
    provider: modrinth
    project_id: 5njdnAZ8
    version_id: x7OaOLDX
    candidate_version: "0.1.13"
    filename: "sable_createaddition_compat-0.1.13.jar"
    download_url: "https://cdn.modrinth.com/data/5njdnAZ8/versions/x7OaOLDX/sable_createaddition_compat-0.1.13.jar"
    release_status: beta
