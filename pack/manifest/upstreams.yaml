  - "Compute and record SHA-256 from the actual artifact."
  - "Resolve and record all transitive dependencies."
  - "Run the Stage 2 dedicated-server/client compatibility matrix."
  - "Run Windows and Apple Silicon client checks where the dependency is client-relevant."
  - "Confirm redistribution/acquisition policy for the launcher/release flow."
  - "Only then copy the promoted exact version/provider IDs/hash into the authoritative locked mods/content-pack manifests."
