# DrewCraft upstream dependency registry
#
# This file records where DrewCraft's third-party dependencies come from and
# how we intend to consume/maintain them. It is NOT the production lockfile.
# A candidate is promoted into the locked pack manifest only after the Stage 2
# compatibility matrix passes and the exact downloaded artifact SHA-256 has
# been recorded.

schema_version: 1
last_researched: "2026-09-12"
target:
  minecraft: "1.21.1"
  loader: "neoforge"
  java: 21

ownership_classes:
  UPSTREAM_BINARY: "Consume an official upstream artifact; do not maintain a DrewCraft fork unless patching becomes necessary and licensing permits it."
  UPSTREAM_SOURCE: "Track an official source repository/ref because the selected candidate is source-built or no suitable immutable binary release has yet been locked."
  DREWCRAFT_FORK: "DrewCraft maintains a minimal patch set against an upstream repository and must track both fork and upstream refs."
  DREWCRAFT_OWNED: "Source is owned and maintained directly by DrewCraft."

policy:
  fork_only_when_required: true
  vendor_upstream_source_in_monorepo: false
  require_exact_sha256_before_lock: true
  require_compatibility_gate_before_lock: true
  obey_upstream_redistribution_terms: true
  notes:
    - "A source repository is tracked for audit/debug/API work even when releases are consumed as binaries."
    - "Do not fork a project merely to make packaging easier; packaging is the manifest/build system's responsibility."
    - "If a fork is required, record the fork repository, upstream repository, exact upstream base ref, and exact DrewCraft commit here."
    - "Third-party binaries and model assets are not committed to this repository by default."

