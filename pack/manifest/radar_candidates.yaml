create_radars:
  display_name: "Create: Radars"
  kind: mod
  required_for_v1: true
  ownership_class: UPSTREAM_BINARY
  side: common
  provider: source_build
  candidate_version: "5.0-EA-2.0.2-1.21.1-dev"
  filename: "create_radar-5.0-EA-2.0.2-1.21.1.jar"
  release_status: experimental
  sha256: null
  required_dependencies:
    - create
    - create_big_cannons
  source_repository: "Arsenalists-of-Create/Create-Radar"
  source_release_boundary: "15e36014949fdbed11c88690b3a68777c604effe"
  target_minecraft: "1.21.1"
  target_loader: "neoforge"
  license: "Arsenalists of Create Source Available License"
  redistribution: "Use the official unmodified provider artifact. Do not copy protected source/assets into DrewCraft."
  integration_policy: "Optional runtime compatibility through isolated reflection and @Pseudo mixins; no DrewCraft fork."
  notes:
    - "The official upstream 1.21.1 development branch is built at a pinned commit because the published 0.4.9.4 artifact contains empty blockstate/model resources."
    - "This is an upstream build, not DrewCraft radar code; promote it only after the combined client/server smoke test passes."
    - "Its 1.21.1 NeoForge metadata requires Create Big Cannons >=5.11.2; this dependency is resolved explicitly rather than discovered only at server boot."
    - "Create: Radars owns dish construction, Create kinetic operation, native tracks, filters, networks and monitors."
    - "V1 uses this only as the unmodified upstream Create radar: native dishes, tracks, filters, networks, and monitors are in scope."
    - "DrewCraft radar-height changes, weather returns, weather overlays, terrain masking, cockpit/airborne integration, and all custom radar coupling are explicitly disabled for V1 and deferred post-V1."
    - "MTS cockpit/airborne radar integration is deferred to V1.1+."

