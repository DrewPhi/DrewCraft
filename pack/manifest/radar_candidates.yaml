  source_release_boundary: "15e36014949fdbed11c88690b3a68777c604effe"
  target_minecraft: "1.21.1"
  target_loader: "neoforge"
  license: "Arsenalists of Create Source Available License"
  redistribution: "Use the official unmodified provider artifact. Do not copy protected source/assets into DrewCraft."
  integration_policy: "Optional runtime compatibility through isolated reflection and @Pseudo mixins; no DrewCraft fork."
  notes:
    - "Official 0.4.9.4 release is the V1 physical radar frontend."
    - "Its 1.21.1 NeoForge metadata requires Create Big Cannons >=5.11.2; this dependency is resolved explicitly rather than discovered only at server boot."
    - "Create: Radars owns dish construction, Create kinetic operation, native tracks, filters, networks and monitors."
    - "DrewCraft contributes cached Project Atmosphere weather returns and Terrain Diffusion terrain masking only."
    - "Project Atmosphere's existing handheld Weather Radar remains the V1 pilot/explorer weather device."
    - "MTS cockpit/airborne radar integration is deferred to V1.1+."

