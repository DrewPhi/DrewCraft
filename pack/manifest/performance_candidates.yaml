rejected_or_deferred:
  noisium:
    reason: "Archived upstream and overlaps the highest-risk worldgen optimization area."
  does_potato_tick:
    reason: "Generic entity freezing could break strategic materialization/encounter semantics; DrewCraft solves macro population scale architecturally."
  generic_ai_throttlers:
    reason: "Do not alter strategic/tactical behavior until actual profiler evidence identifies an AI hotspot that cannot be solved in DrewCraft."
  superchunk:
    reason: "Too aggressive/hardware-specific for the V1 baseline; reconsider only for offline world-build experimentation after the conservative stack is stable."

promotion_requirements:
  - "Acquire the exact artifact through an allowed provider path."
  - "Compute and record SHA-256."
  - "Resolve and record all transitives."
  - "Audit source/license/acquisition/redistribution."
  - "Pass the Stage 2 dedicated-server and supported-client compatibility matrix."
  - "Measure before/after server and client performance on representative DrewCraft workloads."
  - "Reject an optimizer whose benefit is negligible relative to its maintenance/conflict risk."
