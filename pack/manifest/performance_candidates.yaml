# DrewCraft performance compatibility candidates
#
# This file is NOT the production lockfile. Baseline entries are intended for
# the Stage 2 compatibility stack, but promotion still requires exact artifact
# resolution, SHA-256 verification, transitive-dependency resolution, source/
# licensing audit and successful compatibility/performance testing.

schema_version: 1
last_researched: "2026-09-12"
target:
  minecraft: "1.21.1"
  loader: "neoforge"
  java: 21

policy:
  baseline_enters_stage2_compatibility_stack: true
  require_exact_sha256_before_lock: true
  require_transitive_dependency_resolution: true
  require_before_after_measurement: true
  semantics_preserving_defaults_first: true
  c2me_isolated_worldgen_spike: true
  notes:
    - "Performance mods own no gameplay state; DrewCraft strategic/weather/transport authorities remain unchanged."
    - "Do not enable entity-freezing, dynamic-distance, mobcap or async-worldgen behavior merely because it benchmarks faster."
    - "Client culling must be visually tested with Create, MTS, Simple Clouds, Distant Horizons and future DrewCraft radar displays."
    - "Exact provider file IDs marked null must be resolved by the Stage 1 resolver before promotion."

