name: DrewCraft mod CI

on:
  push:
    paths:
      - 'mods/drewcraft/**'
      - '.github/workflows/drewcraft-mod-ci.yml'
  pull_request:
    paths:
      - 'mods/drewcraft/**'
      - '.github/workflows/drewcraft-mod-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile and test DrewCraft
        run: gradle -p mods/drewcraft test build --stacktrace --no-daemon
