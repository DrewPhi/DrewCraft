name: One-shot fix playtest Sable incompatibilities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-playtest-sable-conflicts.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Add resolver exclusions and exclude incompatible optimizers from playtest_01
        run: |
          python - <<'PY'
          from pathlib import Path

          pack = Path('tools/drewcraft_pack.py')
          text = pack.read_text(encoding='utf-8')

          old = '''    roots: list[str] = []\n    policies: list[str] = []\n    overlays: list[str] = []\n    for name in expanded:\n        p = profiles[name]\n        for key in DEP_KEYS:\n'''
          new = '''    roots: list[str] = []\n    policies: list[str] = []\n    overlays: list[str] = []\n    excluded: set[str] = set()\n    for name in expanded:\n        p = profiles[name]\n        excluded_values = p.get("exclude_dependencies") or []\n        if not isinstance(excluded_values, list):\n            raise PackError(f"profile {name}: exclude_dependencies must be a list")\n        excluded.update(str(x) for x in excluded_values)\n        for key in DEP_KEYS:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one resolver root block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    def visit(cid: str) -> None:\n        if cid in done:\n            return\n        if cid in active:\n            raise PackError(f"dependency cycle involving {cid}")\n        if cid not in catalog:\n            raise PackError(f"profile references unknown candidate: {cid}")\n        active.add(cid)\n        deps = catalog[cid].get("required_dependencies") or []\n        if not isinstance(deps, list):\n            raise PackError(f"{cid}: required_dependencies must be a list")\n        for dep in deps:\n            visit(str(dep))\n        active.remove(cid)\n        done.add(cid)\n        ordered.append(cid)\n    for cid in dict.fromkeys(roots):\n        visit(cid)\n    return {\n        "profiles": expanded,\n        "ordered_ids": ordered,\n        "policies": policies,\n        "overlays": list(dict.fromkeys(overlays)),\n    }\n'''
          new = '''    def visit(cid: str, required_by: str | None = None) -> None:\n        if cid in excluded:\n            if required_by is not None:\n                raise PackError(f"profile excludes dependency {cid} required by {required_by}")\n            return\n        if cid in done:\n            return\n        if cid in active:\n            raise PackError(f"dependency cycle involving {cid}")\n        if cid not in catalog:\n            raise PackError(f"profile references unknown candidate: {cid}")\n        active.add(cid)\n        deps = catalog[cid].get("required_dependencies") or []\n        if not isinstance(deps, list):\n            raise PackError(f"{cid}: required_dependencies must be a list")\n        for dep in deps:\n            visit(str(dep), cid)\n        active.remove(cid)\n        done.add(cid)\n        ordered.append(cid)\n    for cid in dict.fromkeys(roots):\n        visit(cid)\n    return {\n        "profiles": expanded,\n        "ordered_ids": ordered,\n        "excluded_ids": sorted(excluded),\n        "policies": policies,\n        "overlays": list(dict.fromkeys(overlays)),\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one visit block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        "schema_version": 1, "profiles": resolved["profiles"],\n        "dependency_count": len(deps), "unresolved_identity_count": unresolved,\n        "policies": resolved["policies"], "overlays": resolved.get("overlays") or [],\n        "dependencies": deps,\n'''
          new = '''        "schema_version": 1, "profiles": resolved["profiles"],\n        "dependency_count": len(deps), "unresolved_identity_count": unresolved,\n        "policies": resolved["policies"], "overlays": resolved.get("overlays") or [],\n        "excluded_dependencies": resolved.get("excluded_ids") or [],\n        "dependencies": deps,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one plan return block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          pack.write_text(text, encoding='utf-8')

          profiles = Path('pack/manifest/profiles.yaml')
          text = profiles.read_text(encoding='utf-8')
          old = '''  playtest_01:\n    extends:\n      - stage2_create_combat_mobility\n      - covenant_endgame_spike\n      - source_structures_first_spike\n    purpose: "playtest-0.1 pack (owner decision C13): full Create combat/mobility stack + Covenant cult roster + natural source structures on the certified base. No SSH/host work included."\n'''
          new = '''  playtest_01:\n    extends:\n      - stage2_create_combat_mobility\n      - covenant_endgame_spike\n      - source_structures_first_spike\n    exclude_dependencies:\n      - embeddium\n      - scalablelux\n    purpose: "playtest-0.1 pack (owner decision C13): full Create combat/mobility stack + Covenant cult roster + natural source structures on the certified base. No SSH/host work included."\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one playtest_01 block, found {text.count(old)}')
          profiles.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_pack_resolver.py')
          text = tests.read_text(encoding='utf-8')
          old = '''            "hostile_a": {"extends": ["base"], "gameplay_components": ["c"], "incompatible_profiles": ["hostile_b"], "overlays": ["pack/overlays/hostile_a"]},\n            "hostile_b": {"extends": ["base"], "gameplay_components": ["d"], "incompatible_profiles": ["hostile_a"]},\n'''
          new = '''            "hostile_a": {"extends": ["base"], "gameplay_components": ["c"], "incompatible_profiles": ["hostile_b"], "overlays": ["pack/overlays/hostile_a"]},\n            "hostile_b": {"extends": ["base"], "gameplay_components": ["d"], "incompatible_profiles": ["hostile_a"]},\n            "without_b": {"extends": ["base"], "exclude_dependencies": ["b"]},\n            "bad_exclude": {"extends": ["base"], "exclude_dependencies": ["lib"]},\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one fixture profile block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''def test_incompatible_profiles_fail_closed(tmp_path: Path):\n'''
          addition = '''def test_profile_can_exclude_inherited_root(tmp_path: Path):\n    profiles, catalog = loaded(fixture_repo(tmp_path))\n    resolved = pack.resolve(["without_b"], profiles, catalog)\n    assert resolved["ordered_ids"] == ["a"]\n    assert resolved["excluded_ids"] == ["b"]\n    assert pack.make_plan(resolved, catalog)["excluded_dependencies"] == ["b"]\n\n\ndef test_excluding_required_transitive_fails_closed(tmp_path: Path):\n    profiles, catalog = loaded(fixture_repo(tmp_path))\n    with pytest.raises(pack.PackError, match="excludes dependency lib required by b"):\n        pack.resolve(["bad_exclude"], profiles, catalog)\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one incompatible-test marker, found {text.count(marker)}')
          text = text.replace(marker, addition + marker, 1)

          text += '''\n\ndef test_playtest_01_excludes_sable_incompatible_optimizers():\n    root = MODULE.parents[1]\n    profiles = pack.load_yaml(root / "pack/manifest/profiles.yaml")\n    catalog = pack.collect_catalog(root, profiles)\n    resolved = pack.resolve(["playtest_01"], profiles, catalog)\n    assert {"embeddium", "scalablelux"} <= set(resolved["excluded_ids"])\n    assert "embeddium" not in resolved["ordered_ids"]\n    assert "scalablelux" not in resolved["ordered_ids"]\n    assert "sable" in resolved["ordered_ids"]\n'''
          tests.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tools/drewcraft_pack.py pack/manifest/profiles.yaml tests/test_pack_resolver.py
      - name: Run resolver tests
        run: pytest -q tests/test_pack_resolver.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/drewcraft_pack.py pack/manifest/profiles.yaml tests/test_pack_resolver.py
          git commit -m 'Exclude Sable-incompatible optimizers from playtest'
          git push origin HEAD:main
