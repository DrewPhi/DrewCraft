name: Promote verified 0.1.14 AOT test pack

on:
  push:
    tags:
      - drewcraft-promote-0.1.14

permissions:
  contents: write

concurrency:
  group: drewcraft-live-dev-pack
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Fetch immutable release and verify deployed server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drewcraft-promote"
          gh release download drewcraft-pack-0.1.14-dev-local --pattern live.json --dir "$RUNNER_TEMP/drewcraft-promote"
          gh release download drewcraft-pack-0.1.14-dev-local --pattern release-manifest.json --dir "$RUNNER_TEMP/drewcraft-promote"
          python tools/release_contract.py validate "$RUNNER_TEMP/drewcraft-promote/release-manifest.json"
          PYTHONPATH=tools python - <<'PY'
          import json, os, pathlib, urllib.request
          from release_contract import manifest_sha256
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drewcraft-promote'
          pointer = json.loads((root / 'live.json').read_text())
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert pointer['packVersion'] == manifest['packVersion'] == '0.1.14-dev-local'
          assert pointer['manifestSha256'] == manifest_sha256(manifest)
          with urllib.request.urlopen('http://150.136.96.174:25566/health', timeout=20) as response:
              health = json.load(response)
          assert health['packVersion'] == '0.1.14-dev-local', health
          assert health['status'] == 'ready' and health['joinable'] is True, health
          assert health['worldId'] == manifest['world']['worldId'], health
          assert health['worldRevision'] == manifest['world']['worldRevision'], health
          print('Verified deployed world and ready server:', health)
          PY
      - name: Promote launcher channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload drewcraft-dev-pack "$RUNNER_TEMP/drewcraft-promote/live.json" --clobber
