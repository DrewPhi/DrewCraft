name: Publish DrewCraft local dev Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-local-dev-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact tested artifacts from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10310691234/zip > /tmp/payload.zip
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10310311856/zip > /tmp/windows.zip
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10309484182/zip > /tmp/macos.zip
          mkdir -p /tmp/payload /tmp/windows /tmp/macos
          unzip -q /tmp/payload.zip -d /tmp/payload
          unzip -q /tmp/windows.zip -d /tmp/windows
          unzip -q /tmp/macos.zip -d /tmp/macos
          test -f /tmp/payload/live.json
          test -f /tmp/payload/0.1.0-dev-local/release-manifest.json
          test -f /tmp/windows/DrewCraft-Windows.exe
          test -f /tmp/macos/DrewCraft-macOS.dmg
          (cd /tmp/payload && sha256sum -c SHA256SUMS)

      - name: Assemble anonymous local-dev Pages tree
        run: |
          set -euo pipefail
          mkdir -p _site/DrewCraft/downloads _site/DrewCraft/dev/releases
          cp /tmp/windows/DrewCraft-Windows.exe _site/DrewCraft/downloads/DrewCraft-Windows.exe
          cp /tmp/macos/DrewCraft-macOS.dmg _site/DrewCraft/downloads/DrewCraft-macOS.dmg
          cp -a /tmp/payload/0.1.0-dev-local _site/DrewCraft/dev/releases/
          cp /tmp/payload/0.1.0-dev-local/verified-pack-evidence.json _site/DrewCraft/dev/releases/0.1.0-dev-local/verified-pack-evidence.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          manifest_path = Path('_site/DrewCraft/dev/releases/0.1.0-dev-local/release-manifest.json')
          manifest = json.loads(manifest_path.read_text('utf-8'))
          old = 'https://drewphi.github.io/DrewCraft/dev/releases'
          new = 'https://drewphi.github.io/ServerMc/DrewCraft/dev/releases'
          for entry in manifest['files']:
              if entry.get('origin', {}).get('type') == 'drewcraft_release' and entry['url'].startswith(old):
                  entry['url'] = new + entry['url'][len(old):]
          payload = (json.dumps(manifest, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode('utf-8')
          manifest_path.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          live = {
              'schemaVersion': 1,
              'channel': 'development',
              'packVersion': manifest['packVersion'],
              'protocolVersion': manifest['protocolVersion'],
              'manifestUrl': 'https://drewphi.github.io/ServerMc/DrewCraft/dev/releases/0.1.0-dev-local/release-manifest.json',
              'manifestSha256': digest,
          }
          Path('_site/DrewCraft/live.json').write_text(json.dumps(live, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          Path('_site/index.html').write_text('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://drewphi.github.io/DrewCraft/">', encoding='utf-8')
          print('manifestSha256=' + digest)
          PY
          test "$(stat -c%s _site/DrewCraft/dev/releases/0.1.0-dev-local/common/mods/terrain-diffusion-mc-neoforge-1.21.1-2.3.0-cpu.jar)" = "93968726"
          test "$(stat -c%s _site/DrewCraft/downloads/DrewCraft-Windows.exe)" = "11958718"
          test "$(stat -c%s _site/DrewCraft/downloads/DrewCraft-macOS.dmg)" = "12116641"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
