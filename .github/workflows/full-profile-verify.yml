name: Verify DrewCraft V1.1 integration profile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/full-profile-verify.yml"
      - "pack/**"
      - "tools/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-profile-verify.yml"
      - "pack/manifest/candidate_hashes.yaml"
      - "pack/manifest/source_build_hashes.yaml"
      - "pack/manifest/source_builds.yaml"
      - "pack/manifest/profiles.yaml"
      - "pack/manifest/upstreams.yaml"
      - "pack/manifest/performance_candidates.yaml"
      - "pack/manifest/radar_candidates.yaml"
      - "tools/build_verified_profile.py"
      - "tools/drewcraft_pack.py"

permissions:
  contents: read

jobs:
  verify-v1-shipping-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.2.1"

      - name: Install pack tooling
        run: python -m pip install -r tools/requirements-pack.txt

      - name: Prepare exact V1.1 integration evidence
        run: python tools/prepare_integration_profile.py

      - name: Read Terrain Diffusion Plus source pin
        id: td
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d=yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['terrain_diffusion_plus']
          print('repository=' + d['source']['repository'])
          print('ref=' + d['source']['ref'])
          PY

      - name: Build exact Terrain Diffusion Plus jar
        run: |
          git clone "https://github.com/${{ steps.td.outputs.repository }}.git" /tmp/terrain-diffusion-plus
          cd /tmp/terrain-diffusion-plus
          git checkout --detach "${{ steps.td.outputs.ref }}"
          test "$(git rev-parse HEAD)" = "${{ steps.td.outputs.ref }}"
          ./gradlew -p versions/1.21.1 buildNeoForgeCpu --no-daemon

      - name: Build pinned Create Radar upstream fix
        id: radar
        run: |
          readarray -t RADAR_SOURCE < <(python - <<'PY'
          import yaml
          item = yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['create_radars']
          print(item['source']['repository'])
          print(item['source']['ref'])
          PY
          )
          rm -rf /tmp/create-radar-upstream
          git clone "https://github.com/${RADAR_SOURCE[0]}.git" /tmp/create-radar-upstream
          cd /tmp/create-radar-upstream
          git checkout --detach "${RADAR_SOURCE[1]}"
          test "$(git rev-parse HEAD)" = "${RADAR_SOURCE[1]}"
          bash gradlew build --no-daemon
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, yaml
          spec=yaml.safe_load((pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'pack/manifest/source_builds.yaml').read_text())['source_builds']['create_radars']
          libs=pathlib.Path('/tmp/create-radar-upstream')/spec['build']['output_directory']
          jars=[p for p in sorted(libs.glob('*.jar')) if not p.name.lower().endswith(('-sources.jar','-source.jar','-javadoc.jar','-dev.jar'))]
          if len(jars) != 1:
              raise SystemExit(f'Expected one production Create Radar jar, found {[p.name for p in jars]}')
          print('path=' + str(jars[0]))
          PY

      - name: Locate exact Terrain Diffusion Plus production jar
        id: tdjar
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          spec=yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['terrain_diffusion_plus']
          libs=pathlib.Path('/tmp/terrain-diffusion-plus')/spec['build']['output_directory']
          jars=[]
          for p in sorted(libs.glob('*.jar')):
              low=p.name.lower()
              if any(x in low for x in ('-sources.jar','-javadoc.jar','-dev.jar','-test.jar','-tests.jar')):
                  continue
              jars.append(p)
          if len(jars) != 1:
              raise SystemExit(f'Expected one production Terrain Diffusion Plus jar, found {[p.name for p in jars]}')
          print('path=' + str(jars[0]))
          PY

      - name: Rebuild and verify full current dependency profile
        run: |
          python tools/build_verified_profile.py \
            --profile v1_1_integration \
            --source-artifact "terrain_diffusion_plus=${{ steps.tdjar.outputs.path }}" \
            --source-artifact "create_radars=${{ steps.radar.outputs.path }}" \
            --output-dir build/verified-pack \
            --evidence-output build/full-profile-verification.json

      - name: Upload verification evidence only
        uses: actions/upload-artifact@v4
        with:
          name: full-profile-verification
          path: |
            build/full-profile-verification.json
            build/verified-pack/client/drewcraft-layout.json
            build/verified-pack/server/drewcraft-layout.json
