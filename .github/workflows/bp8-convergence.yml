name: BP8 convergence

on:
  push:
    branches: [bp8-convergence, main]
    paths:
      - 'launcher/**'
      - 'infra/**'
      - 'tools/release_contract.py'
      - 'tools/build_release_manifest.py'
      - 'tools/apply_release_acquisition.py'
      - 'tools/package_release_payload.py'
      - 'tools/assemble_release_layout.py'
      - 'tools/assemble_server_application.py'
      - 'tools/inject_drewcraft_mod.py'
      - 'tools/evaluate_world_candidates.py'
      - 'tools/world_seed_index.py'
      - 'tools/world_bundle.py'
      - 'world/**'
      - 'tests/test_bp8_*.py'
      - 'pack/manifest/pack.yaml'
      - 'pack/manifest/platform.yaml'
      - 'pack/manifest/candidate_hashes.yaml'
      - 'mods/drewcraft/**'
      - '.github/workflows/bp8-convergence.yml'
      - '.github/workflows/release-candidate-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release tooling dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Release/deploy/world proofs
        run: python -m unittest discover -s tests -p 'test_bp8_*.py' -v
      - name: Validate JSON locks/plans and workflow syntax
        run: |
          python -m json.tool launcher/runtime-lock.json >/dev/null
          python -m json.tool world/production-world.plan.json >/dev/null
          python -m json.tool world/source-mappings.json >/dev/null
          python - <<'PY'
          import yaml
          for path in ('.github/workflows/bp8-convergence.yml', '.github/workflows/release-candidate-build.yml'):
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('parsed', path)
          PY

  server-application-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Download and verify pinned NeoForge installer
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, yaml
          loader = yaml.safe_load(pathlib.Path('pack/manifest/platform.yaml').read_text('utf-8'))['loader']
          out = pathlib.Path('/tmp/neoforge-installer.jar')
          with urllib.request.urlopen(urllib.request.Request(loader['installer_url'], headers={'User-Agent':'DrewCraft-BP8/1'}), timeout=180) as response:
              out.write_bytes(response.read())
          got = hashlib.sha256(out.read_bytes()).hexdigest()
          assert got == loader['installer_sha256'], (got, loader['installer_sha256'])
          print('installer sha256', got)
          PY
      - name: Build exact NeoForge server runtime
        run: |
          rm -rf /tmp/neoforge-runtime
          mkdir -p /tmp/neoforge-runtime
          java -jar /tmp/neoforge-installer.jar --installServer /tmp/neoforge-runtime
          test -f /tmp/neoforge-runtime/run.sh
          test -d /tmp/neoforge-runtime/libraries
      - name: Assemble immutable DrewCraft server application
        run: |
          mkdir -p build/fake-verified-server/mods build/fake-verified-server/config
          printf 'verified DrewCraft mod\n' > build/fake-verified-server/mods/drewcraft.jar
          printf 'managed=true\n' > build/fake-verified-server/config/drewcraft.toml
          printf '{}\n' > build/fake-verified-server/drewcraft-layout.json
          python tools/assemble_server_application.py \
            --runtime /tmp/neoforge-runtime \
            --pack build/fake-verified-server \
            --output build/server-application
          test -f build/server-application/run.sh
          test -d build/server-application/libraries
          test -f build/server-application/mods/drewcraft.jar
          test -f build/server-application/eula.txt
          grep -q -- '-Xmx8G' build/server-application/user_jvm_args.txt
          test ! -e build/server-application/world
          test ! -e build/server-application/logs

  server-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Prove native ARM64 Java
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          java -version
      - name: Compile and test DrewCraft on ARM64
        run: gradle -p mods/drewcraft test build --stacktrace --no-daemon
      - name: Prove DrewCraft production jar exists
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'tools')
          import inject_drewcraft_mod as inject
          jar = inject.production_jar(pathlib.Path('mods/drewcraft/build/libs'))
          print(jar)
          assert jar.is_file()
          PY

  launcher-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify pinned Java and Prism archives
        shell: pwsh
        run: |
          @'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, 'launcher')
          import drewcraft_bootstrap as b
          lock = json.loads(pathlib.Path('launcher/runtime-lock.json').read_text('utf-8'))
          runtime = b.ensure_runtime({'runtime': lock['platforms']}, pathlib.Path('.runtime-proof'))
          subprocess.run([runtime['java'], '-version'], check=True)
          prism = pathlib.Path(runtime['prism'])
          assert prism.name.lower() == 'prismlauncher.exe' and prism.is_file()
          assert prism.read_bytes()[:2] == b'MZ', 'Prism executable is not a Windows PE file'
          print(runtime)
          '@ | python -
      - name: Build Windows one-click executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi==2026.7.22
          python -c "import certifi; print(certifi.where())"
          pyinstaller --noconfirm --clean --onefile --windowed --name DrewCraft --paths launcher launcher/drewcraft_entry.py
          if (-not (Test-Path dist/DrewCraft.exe)) { throw "DrewCraft.exe missing" }
          Copy-Item dist/DrewCraft.exe dist/DrewCraft-Windows.exe
      - name: Upload Windows bootstrap
        uses: actions/upload-artifact@v6
        with:
          name: DrewCraft-Windows-x86_64
          path: dist/DrewCraft-Windows.exe
          if-no-files-found: error

  launcher-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
      - name: Verify pinned Java and Prism archives
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, 'launcher')
          import drewcraft_bootstrap as b
          lock = json.loads(pathlib.Path('launcher/runtime-lock.json').read_text('utf-8'))
          runtime = b.ensure_runtime({'runtime': lock['platforms']}, pathlib.Path('.runtime-proof'))
          subprocess.run([runtime['java'], '-version'], check=True)
          subprocess.run([runtime['prism'], '--version'], check=True)
          print(runtime)
          PY
      - name: Build Apple Silicon app and DMG
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi==2026.7.22
          python -c "import certifi; print(certifi.where())"
          pyinstaller --noconfirm --clean --windowed --name DrewCraft --paths launcher launcher/drewcraft_entry.py
          test -d dist/DrewCraft.app
          file dist/DrewCraft.app/Contents/MacOS/DrewCraft | tee mac-binary.txt
          grep -q 'arm64' mac-binary.txt
          codesign --force --deep --sign - dist/DrewCraft.app
          codesign --verify --deep --strict dist/DrewCraft.app
          hdiutil create -volname DrewCraft -srcfolder dist/DrewCraft.app -ov -format UDZO dist/DrewCraft-macOS.dmg
          # Raw updater-consumed binary: the in-app self-updater replaces only
          # Contents/MacOS/DrewCraft, so publish the bare binary alongside the DMG.
          cp dist/DrewCraft.app/Contents/MacOS/DrewCraft dist/DrewCraft-macOS-arm64
          test -x dist/DrewCraft-macOS-arm64
      - name: Upload Mac bootstrap
        uses: actions/upload-artifact@v6
        with:
          name: DrewCraft-macOS-arm64
          path: |
            dist/DrewCraft-macOS.dmg
            dist/DrewCraft-macOS-arm64
          if-no-files-found: error

  launcher-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove x86-64 Linux runner
        run: |
          test "$(uname -m)" = "x86_64"
          ldd --version
      - name: Verify pinned Java and Prism archives
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'launcher')
          import drewcraft_bootstrap as b
          lock = json.loads(pathlib.Path('launcher/runtime-lock.json').read_text('utf-8'))
          runtime = b.ensure_runtime({'runtime': lock['platforms']}, pathlib.Path('.runtime-proof'))
          subprocess.run([runtime['java'], '-version'], check=True)
          env = {**os.environ, 'QT_QPA_PLATFORM': 'offscreen'}
          subprocess.run([runtime['prism'], '--version'], check=True, env=env)
          print(runtime)
          PY
      - name: Build Ubuntu/Debian launcher package
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi==2026.7.22
          python -c "import certifi; print(certifi.where())"
          pyinstaller --noconfirm --clean --onefile --name DrewCraft --paths launcher launcher/drewcraft_entry.py
          test -x dist/DrewCraft
          mkdir -p build/deb/DEBIAN build/deb/usr/bin build/deb/usr/share/applications
          install -m 0755 dist/DrewCraft build/deb/usr/bin/drewcraft
          install -m 0644 launcher/linux/control build/deb/DEBIAN/control
          install -m 0644 launcher/linux/drewcraft.desktop build/deb/usr/share/applications/drewcraft.desktop
          dpkg-deb --build --root-owner-group build/deb dist/DrewCraft-Linux.deb
          dpkg-deb --info dist/DrewCraft-Linux.deb
      - name: Upload Linux bootstrap
        uses: actions/upload-artifact@v6
        with:
          name: DrewCraft-Linux-x86_64
          path: dist/DrewCraft-Linux.deb
          if-no-files-found: error

  publish-launchers:
    if: github.ref == 'refs/heads/main'
    needs: [launcher-windows, launcher-macos-arm64, launcher-linux-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: DrewCraft-*
          path: dist
          merge-multiple: true
      - name: Verify public launcher filenames
        run: |
          test -f dist/DrewCraft-Windows.exe
          test -f dist/DrewCraft-macOS.dmg
          test -f dist/DrewCraft-macOS-arm64
          test -f dist/DrewCraft-Linux.deb
      - name: Publish launcher version 0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view launcher-v0.1.3 >/dev/null 2>&1; then
            gh release create launcher-v0.1.3 \
              --target "$GITHUB_SHA" \
              --title "DrewCraft Launcher 0.1.3" \
              --notes "Development launcher with one-click post-authentication launch, visible download progress, Windows/macOS/Linux support, and Terrain Diffusion model-cache preservation across updates." \
              --prerelease
          fi
          gh release upload launcher-v0.1.3 \
            dist/DrewCraft-Windows.exe \
            dist/DrewCraft-macOS.dmg \
            dist/DrewCraft-macOS-arm64 \
            dist/DrewCraft-Linux.deb \
            --clobber
