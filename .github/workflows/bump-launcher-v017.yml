name: One-shot clean launcher v0.1.7 bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-launcher-v017.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Change exactly one launcher version line
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('launcher/drewcraft_bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "0.1.6"'
          new = 'APP_VERSION = "0.1.7"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- launcher/drewcraft_bootstrap.py)" = $'1\t1\tlauncher/drewcraft_bootstrap.py'
          git diff -- launcher/drewcraft_bootstrap.py
      - name: Commit clean version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/drewcraft_bootstrap.py
          git commit -m 'Bump launcher to v0.1.7'
          git push origin HEAD:main
      - name: Build and republish v0.1.7 from the clean source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bp8-convergence.yml --ref main
