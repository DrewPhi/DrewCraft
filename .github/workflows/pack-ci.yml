name: Pack manifests

on:
  push:
    branches: [main]
    paths:
      - "pack/**"
      - "tools/drewcraft_pack.py"
      - "tools/requirements-pack.txt"
      - "tests/test_pack_resolver.py"
      - "tests/test_source_worldgen_policy.py"
      - ".github/workflows/pack-ci.yml"
  pull_request:
    paths:
      - "pack/**"
      - "tools/drewcraft_pack.py"
      - "tools/requirements-pack.txt"
      - "tests/test_pack_resolver.py"
      - "tests/test_source_worldgen_policy.py"
      - ".github/workflows/pack-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install -r tools/requirements-pack.txt
      - name: Unit tests before provider preparation
        run: python -m pytest -q tests/test_pack_resolver.py tests/test_source_worldgen_policy.py tests/test_mts_create_integration.py
      - name: Prepare exact V1.1 provider/hash/recipe evidence
        run: python tools/prepare_integration_profile.py
      - name: Unit tests against generated exact integration
        run: python -m pytest -q tests/test_pack_resolver.py tests/test_source_worldgen_policy.py tests/test_mts_create_integration.py
      - name: Validate V1 shipping profile graph
        run: python tools/drewcraft_pack.py validate --profile v1_survival_exploration --output build/v1-shipping-plan.json
      - name: Validate V1.1 integration profile graph
        run: python tools/drewcraft_pack.py validate --profile v1_1_integration --output build/v1-1-integration-plan.json
      - name: Show unresolved exact identities
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/v1-shipping-plan.json'))
          print(f"dependencies={p['dependency_count']} unresolved_identities={p['unresolved_identity_count']}")
          for d in p['dependencies']:
              if not d['exact_identity_ready']:
                  print(f"- {d['id']}: {', '.join(d['identity_issues'])}")
          PY
      - name: Commit generated integration evidence to audit branch
        if: github.event_name == 'pull_request' && github.head_ref == '0.1.8-dev-integration'
        run: |
          git config user.name "DrewCraft Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             pack/manifest/candidate_hashes.yaml             pack/manifest/integration_mts_v29_balance.json             pack/overlays/v1_1_integration/config/mtscraftingoverrides.json             pack/overlays/v1_1_integration/datapacks/drewcraft-integration
          if git diff --cached --quiet; then
            echo "Generated integration evidence already current."
          else
            git commit -m "integration: lock exact artifacts and generated V29 integration"
            git push origin HEAD:0.1.8-dev-integration
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v1-shipping-plan
          path: |
            build/v1-shipping-plan.json
            build/v1-1-integration-plan.json
