name: Pack manifests

on:
  push:
    branches: [main]
    paths:
      - "pack/**"
      - "tools/drewcraft_pack.py"
      - "tools/requirements-pack.txt"
      - "tests/test_pack_resolver.py"
      - "tests/test_source_worldgen_policy.py"
      - ".github/workflows/pack-ci.yml"
  pull_request:
    paths:
      - "pack/**"
      - "tools/drewcraft_pack.py"
      - "tools/requirements-pack.txt"
      - "tests/test_pack_resolver.py"
      - "tests/test_source_worldgen_policy.py"
      - ".github/workflows/pack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install -r tools/requirements-pack.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_pack_resolver.py tests/test_source_worldgen_policy.py
      - name: Validate base profile graph
        run: python tools/drewcraft_pack.py validate --profile stage2_base_performance --output build/stage2-base-plan.json
      - name: Show unresolved exact identities
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/stage2-base-plan.json'))
          print(f"dependencies={p['dependency_count']} unresolved_identities={p['unresolved_identity_count']}")
          for d in p['dependencies']:
              if not d['exact_identity_ready']:
                  print(f"- {d['id']}: {', '.join(d['identity_issues'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-base-plan
          path: build/stage2-base-plan.json
