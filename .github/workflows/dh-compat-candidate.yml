name: DH 3.3.3 compatibility candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-dh-and-chunky-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch pinned source and exact regression dependencies
        run: |
          git clone --depth 1 --branch 3.3.3 --recurse-submodules --shallow-submodules https://gitlab.com/distant-horizons-team/distant-horizons.git build/dh-upstream
          test "$(git -C build/dh-upstream rev-parse HEAD)" = a54dd3eb1df0078e63a71266d042c10d9cda4493
          test "$(git -C build/dh-upstream/coreSubProjects rev-parse HEAD)" = b02c66d778beea11a931291815d652cd8abaa7ad
          mkdir -p build/dh-input
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('build/dh-input')
          urls={
            'dh333.jar':'https://cdn.modrinth.com/data/uCdwusMi/versions/9w34y8ai/DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar',
            'log4j-api.jar':'https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-api/2.22.1/log4j-api-2.22.1.jar',
            'log4j-core.jar':'https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.22.1/log4j-core-2.22.1.jar',
          }
          for name,url in urls.items():
              with urllib.request.urlopen(url,timeout=120) as response:
                  (root/name).write_bytes(response.read())
          with urllib.request.urlopen('https://github.com/DrewPhi/DrewCraft/releases/download/drewcraft-pack-0.1.17-rc.2/release-manifest.json',timeout=120) as response:
              manifest=response.read()
          assert hashlib.sha256(manifest).hexdigest()=='7d17795ebc8d1da7076a69913233370c24072504c1edb5000959f82c7bef95e2'
          item=next(e for e in json.loads(manifest)['files'] if e['path']=='mods/Chunky-NeoForge-1.4.23.jar')
          with urllib.request.urlopen(item['url'],timeout=120) as response:
              data=response.read()
          assert hashlib.sha256(data).hexdigest()==item['sha256']
          (root/'chunky.jar').write_bytes(data)
          PY
      - name: Compile source patch and prove regression on actual DH class
        run: |
          python tools/build_dh_compat.py --source build/dh-upstream --jar build/dh-input/dh333.jar --chunky-jar build/dh-input/chunky.jar --dependency-jar build/dh-input/log4j-api.jar --dependency-jar build/dh-input/log4j-core.jar --output build/dh-compat
      - name: Prepare pinned isolated NeoForge and Chunky runtime
        run: |
          python -m pip install --disable-pip-version-check rcon==2.4.9
          python - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess,urllib.request
          root=pathlib.Path('build/dh-smoke');root.mkdir()
          def fetch(url):
              with urllib.request.urlopen(url,timeout=120) as response:return response.read()
          installer=pathlib.Path('build/neoforge-installer.jar')
          installer.write_bytes(fetch('https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-installer.jar'))
          assert hashlib.sha256(installer.read_bytes()).hexdigest()=='0e47a91ba2139a8db4bf7627af081f7b5789b508bb039ee8dea1272b79693d60'
          subprocess.run(['java','-jar',str(installer),'--installServer',str(root)],check=True)
          manifest=fetch('https://github.com/DrewPhi/DrewCraft/releases/download/drewcraft-pack-0.1.17-rc.2/release-manifest.json')
          assert hashlib.sha256(manifest).hexdigest()=='7d17795ebc8d1da7076a69913233370c24072504c1edb5000959f82c7bef95e2'
          item=next(e for e in json.loads(manifest)['files'] if e['path']=='mods/Chunky-NeoForge-1.4.23.jar')
          data=fetch(item['url']);assert hashlib.sha256(data).hexdigest()==item['sha256']
          (root/'mods').mkdir(exist_ok=True)
          (root/item['path']).write_bytes(data)
          # This branch tests preload compatibility with the EXACT live DH
          # artifact, not a newly timestamped rebuild of equivalent classes.
          candidate=fetch('https://github.com/DrewPhi/DrewCraft/releases/download/drewcraft-pack-0.1.18/common--mods--DistantHorizons-3.3.3-1.21.1-drewcraft.1.jar')
          assert hashlib.sha256(candidate).hexdigest()=='b43f5ac302a2ed6039d34f737d3182a0bc771333c71653c06aa7528cae6ecb67'
          (root/'mods/DistantHorizons-3.3.3-1.21.1-drewcraft.1.jar').write_bytes(candidate)
          PY
      - name: Verify actual startup, Chunky, native LOD output and restart
        run: python tools/dh_candidate_smoke.py build/dh-smoke
      - name: Verify real DH accepts radius-preload exported/imported data
        run: python tools/dh_preload_runtime_smoke.py build/dh-smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dh-3.3.3-compat-candidate
          path: |
            build/dh-compat/*.jar
            build/dh-compat/*.json
            build/dh-compat/*.tar.gz
            build/dh-smoke/smoke-server.log
            build/dh-smoke/smoke-result.json
            build/dh-smoke/preload-result.json
            build/dh-smoke/preload-restart.log
            build/dh-smoke/logs/*.log
          if-no-files-found: error
