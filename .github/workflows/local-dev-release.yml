name: Build DrewCraft local dev release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-dev-release.yml'
      - 'dev-release/**'
      - 'pack/manifest/**'
      - 'pack/overlays/**'
      - 'mods/drewcraft/**'
      - 'tools/apply_release_acquisition.py'
      - 'tools/assemble_release_layout.py'
      - 'tools/build_release_manifest.py'
      - 'tools/build_verified_profile.py'
      - 'tools/inject_drewcraft_mod.py'
      - 'tools/package_release_payload.py'
      - 'tools/release_contract.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drewcraft-live-dev-pack
  cancel-in-progress: false

env:
  PACK_VERSION: 0.1.5-dev-local
  DEV_RELEASE_TAG: drewcraft-dev-pack

jobs:
  build-local-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Install pack tooling
        run: python -m pip install --disable-pip-version-check -r tools/requirements-pack.txt

      - name: Build DrewCraft integration mod
        run: gradle -p mods/drewcraft clean test build --stacktrace --no-daemon

      - name: Read pinned Terrain Diffusion source identity
        id: terrain
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          item = yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['terrain_diffusion_plus']
          print('repository=' + item['source']['repository'])
          print('ref=' + item['source']['ref'])
          PY

      - name: Build pinned Create Radar upstream fix
        id: radar
        run: |
          readarray -t RADAR_SOURCE < <(python - <<'PY'
          import yaml
          item = yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['create_radars']
          print(item['source']['repository'])
          print(item['source']['ref'])
          print(item['build']['output_directory'])
          PY
          )
          RADAR_REPOSITORY="${RADAR_SOURCE[0]}"
          RADAR_REF="${RADAR_SOURCE[1]}"
          RADAR_OUTPUT_DIRECTORY="${RADAR_SOURCE[2]}"
          rm -rf /tmp/create-radar-upstream
          git clone "https://github.com/${RADAR_REPOSITORY}.git" /tmp/create-radar-upstream
          cd /tmp/create-radar-upstream
          git checkout --detach "$RADAR_REF"
          test "$(git rev-parse HEAD)" = "$RADAR_REF"
          bash gradlew build --no-daemon
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          item = yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['create_radars']
          libs = pathlib.Path('/tmp/create-radar-upstream') / item['build']['output_directory']
          jars = [p for p in sorted(libs.glob('*.jar')) if not p.name.lower().endswith(('-sources.jar','-source.jar','-javadoc.jar','-dev.jar'))]
          if len(jars) != 1:
              raise SystemExit(f'expected one Create Radar production jar, got {[p.name for p in jars]}')
          print('path=' + str(jars[0]))
          PY

      - name: Build exact Terrain Diffusion Plus source artifact
        run: |
          rm -rf /tmp/terrain-diffusion-plus
          git clone "https://github.com/${{ steps.terrain.outputs.repository }}.git" /tmp/terrain-diffusion-plus
          cd /tmp/terrain-diffusion-plus
          git checkout --detach "${{ steps.terrain.outputs.ref }}"
          test "$(git rev-parse HEAD)" = "${{ steps.terrain.outputs.ref }}"
          ./gradlew -p versions/1.21.1 buildNeoForgeCpu --no-daemon

      - name: Locate Terrain Diffusion production jar
        id: tdjar
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          item = yaml.safe_load(open('pack/manifest/source_builds.yaml'))['source_builds']['terrain_diffusion_plus']
          libs = pathlib.Path('/tmp/terrain-diffusion-plus') / item['build']['output_directory']
          jars = [p for p in sorted(libs.glob('*.jar')) if not p.name.lower().endswith(('-sources.jar','-source.jar','-javadoc.jar','-test.jar','-tests.jar'))]
          if len(jars) != 1:
              raise SystemExit(f'expected one Terrain Diffusion production jar, got {[p.name for p in jars]}')
          print('path=' + str(jars[0]))
          PY

      - name: Build exact verified client/server trees
        run: |
          python tools/build_verified_profile.py \
            --profile v1_survival_exploration \
            --source-artifact "terrain_diffusion_plus=${{ steps.tdjar.outputs.path }}" \
            --source-artifact "create_radars=${{ steps.radar.outputs.path }}" \
            --output-dir build/verified-pack \
            --evidence-output build/verified-pack-evidence.json

      - name: Inject compiled DrewCraft mod
        run: |
          python tools/inject_drewcraft_mod.py \
            --client build/verified-pack/client \
            --server build/verified-pack/server
          python tools/drewcraft_pack.py verify build/verified-pack/client
          python tools/drewcraft_pack.py verify build/verified-pack/server

      - name: Install pinned NeoForge server runtime
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, yaml
          loader = yaml.safe_load(open('pack/manifest/platform.yaml'))['loader']
          out = pathlib.Path('/tmp/neoforge-installer.jar')
          req = urllib.request.Request(loader['installer_url'], headers={'User-Agent': 'DrewCraft-Release/1'})
          with urllib.request.urlopen(req, timeout=180) as response:
              out.write_bytes(response.read())
          got = hashlib.sha256(out.read_bytes()).hexdigest()
          expected = loader.get('installer_sha256')
          if expected and got.lower() != expected.lower():
              raise SystemExit(f'NeoForge installer hash mismatch expected={expected} got={got}')
          print('NeoForge installer SHA-256:', got)
          PY
          rm -rf /tmp/drewcraft-server-runtime
          mkdir -p /tmp/drewcraft-server-runtime
          java -jar /tmp/neoforge-installer.jar --installServer /tmp/drewcraft-server-runtime

      - name: Assemble complete verified server application
        run: |
          python tools/assemble_server_application.py \
            --runtime /tmp/drewcraft-server-runtime \
            --pack build/verified-pack/server \
            --output build/verified-pack/server-application

      - name: Assemble local-dev release layout
        run: |
          python tools/assemble_release_layout.py \
            --client build/verified-pack/client \
            --server build/verified-pack/server-application \
            --output build/release-layout

      - name: Build provider-aware local-dev manifest
        run: |
          python tools/build_release_manifest.py \
            --layout build/release-layout \
            --output build/release-manifest.raw.json \
            --base-url https://drewphi.github.io/DrewCraft/dev/releases \
            --pack-version "$PACK_VERSION" \
            --protocol-version 1 \
            --world-id drewcraft-production \
            --world-revision 1 \
            --generation-pack-version drewcraft-worldgen-1 \
            --minecraft-version 1.21.1 \
            --neoforge-version 21.1.250 \
            --minimum-launcher-version 0.1.8 \
            --server-address 150.136.96.174:25565 \
            --health-url http://150.136.96.174:25566/health \
            --runtime-lock launcher/runtime-lock.json
          python tools/apply_release_acquisition.py build/release-manifest.raw.json \
            --output build/release-manifest.json

      - name: Retarget DrewCraft-owned files to prerelease assets
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil
          import urllib.parse

          repo = "DrewPhi/DrewCraft"
          tag = "drewcraft-dev-pack"
          manifest_path = pathlib.Path("build/release-manifest.json")
          layout = pathlib.Path("build/release-layout")
          assets = pathlib.Path("build/dev-release-assets")
          if assets.exists():
              shutil.rmtree(assets)
          assets.mkdir(parents=True)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for entry in manifest["files"]:
              if entry.get("origin", {}).get("type") != "drewcraft_release":
                  continue
              side = entry["side"]
              rel = entry["path"]
              source = layout / side / rel
              if not source.is_file():
                  raise SystemExit(f"missing release-owned file: {side}:{rel}")
              asset_name = side + "--" + rel.replace("/", "--")
              shutil.copy2(source, assets / asset_name)
              entry["url"] = (
                  f"https://github.com/{repo}/releases/download/{tag}/"
                  + urllib.parse.quote(asset_name)
              )

          manifest_path.write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python tools/release_contract.py validate build/release-manifest.json
          python tools/release_contract.py promote build/release-manifest.json \
            --manifest-url "https://github.com/DrewPhi/DrewCraft/releases/download/$DEV_RELEASE_TAG/release-manifest.json" \
            --channel development \
            --output build/live.json
          cp build/release-manifest.json build/dev-release-assets/release-manifest.json
          cp build/live.json build/dev-release-assets/live.json
          cp build/verified-pack-evidence.json build/dev-release-assets/verified-pack-evidence.json

      - name: Publish live dev-pack prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$DEV_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$DEV_RELEASE_TAG" \
              --title "DrewCraft live development pack" \
              --notes "Machine-managed focused V1 survival/exploration payload. The friend launcher follows live.json from this prerelease." \
              --prerelease
          else
            gh release create "$DEV_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "DrewCraft live development pack" \
              --notes "Machine-managed focused V1 survival/exploration payload. The friend launcher follows live.json from this prerelease." \
              --prerelease
          fi

          # Publish all content first; publish the pointer last so clients never
          # observe a live.json that references assets still being uploaded.
          find build/dev-release-assets -maxdepth 1 -type f ! -name live.json -print0 \
            | xargs -0 gh release upload "$DEV_RELEASE_TAG" --clobber
          gh release upload "$DEV_RELEASE_TAG" build/dev-release-assets/live.json --clobber

      - name: Package public local-dev payload
        run: |
          python tools/package_release_payload.py \
            --layout build/release-layout \
            --manifest build/release-manifest.json \
            --live build/live.json \
            --evidence build/verified-pack-evidence.json \
            --output build/public-dev
          find build/public-dev -type f -maxdepth 8 -printf '%p %s bytes\n' | sort

      - name: Upload local-dev payload archive
        uses: actions/upload-artifact@v6
        with:
          name: DrewCraft-local-dev-publish
          path: build/public-dev
          if-no-files-found: error
          compression-level: 0
