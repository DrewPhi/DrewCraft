name: One-shot refresh clean v0.1.7 aliases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v017-aliases.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy clean current installers to versioned friend filenames
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=launcher-v0.1.7
          mkdir -p dist
          gh release download "$tag" \
            --pattern 'DrewCraft-Windows.exe' \
            --pattern 'DrewCraft-macOS.dmg' \
            --pattern 'DrewCraft-Linux.deb' \
            --dir dist --clobber
          cp dist/DrewCraft-Windows.exe dist/DrewCraft-Windows-v0.1.7.exe
          cp dist/DrewCraft-macOS.dmg dist/DrewCraft-macOS-v0.1.7.dmg
          cp dist/DrewCraft-Linux.deb dist/DrewCraft-Linux-v0.1.7.deb
          gh release upload "$tag" \
            dist/DrewCraft-Windows-v0.1.7.exe \
            dist/DrewCraft-macOS-v0.1.7.dmg \
            dist/DrewCraft-Linux-v0.1.7.deb \
            --clobber
