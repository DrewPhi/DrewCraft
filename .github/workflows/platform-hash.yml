name: Hash platform artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-hash.yml"
      - "pack/manifest/platform.yaml"

permissions:
  contents: read

jobs:
  hash-neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash exact NeoForge installer
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request, yaml
          p=yaml.safe_load(open('pack/manifest/platform.yaml'))
          loader=p['loader']
          url=loader['installer_url']
          req=urllib.request.Request(url, headers={'User-Agent':'DrewCraft-PlatformHasher/0.1'})
          with urllib.request.urlopen(req, timeout=180) as r:
              data=r.read()
          sha=hashlib.sha256(data).hexdigest()
          report={
              'schema_version':1,
              'id':'neoforge_installer',
              'minecraft':p['minecraft']['version'],
              'loader':'neoforge',
              'version':loader['version'],
              'filename':loader['installer_filename'],
              'url':url,
              'size':len(data),
              'sha256':sha,
          }
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/platform-hashes.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: platform-hashes
          path: build/platform-hashes.json
