name: DH full-pack Linear upgrade acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fullpack-linear-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: dh-3.3.3-compat-candidate
          run-id: 38593392410
          github-token: ${{ github.token }}
          path: build/accepted-candidate
      - name: Check migration unit tests
        run: |
          python -m pip install --disable-pip-version-check rcon==2.4.9 pytest
          python -m pytest -q tests/test_dh_config_upgrade.py
      - name: Assemble exact released server mod set (isolated)
        run: python tools/dh_fullpack_prepare.py build/dh-fullpack
      - name: Verify baseline save, upgrade, Linear LOD reading, config preservation and restart
        run: |
          python tools/dh_fullpack_smoke.py build/dh-fullpack build/accepted-candidate/dh-compat/DistantHorizons-3.3.3-1.21.1-drewcraft.1.jar
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dh-fullpack-upgrade-evidence
          path: |
            build/dh-fullpack/*331.log
            build/dh-fullpack/seed-flat.log
            build/dh-fullpack/*333.log
            build/dh-fullpack/candidate-restart.log
            build/dh-fullpack/fullpack-result.json
            build/dh-fullpack/verified-input.json
            build/dh-fullpack/logs/*.log
            build/dh-fullpack/crash-reports/*.txt
          if-no-files-found: warn
