<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171717" />
  <title>DrewCraft</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.10), transparent 34rem),
        linear-gradient(180deg, #171717 0%, #0b0b0b 100%);
    }

    main {
      width: min(720px, calc(100% - 40px));
      text-align: center;
      padding: 64px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 13vw, 8rem);
      line-height: .9;
      letter-spacing: -.065em;
      font-weight: 900;
    }

    p {
      margin: 28px auto 42px;
      max-width: 560px;
      color: #bdbdbd;
      font-size: 1.15rem;
      line-height: 1.55;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 590px;
      margin: 0 auto;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      padding: 18px 22px;
      border-radius: 14px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      transition: transform .12s ease, background .12s ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: #e9e9e9;
    }

    small {
      display: block;
      margin-top: 28px;
      color: #666;
    }

    @media (max-width: 560px) {
      .downloads { grid-template-columns: 1fr; }
      main { padding: 48px 10px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>DrewCraft</h1>
    <p>One-click install. The launcher handles Minecraft, Java, mods, configs, and updates for you.</p>

    <div class="downloads">
      <a href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-Windows.exe">Download for Windows</a>
      <a href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-macOS.dmg">Download for Mac</a>
    </div>

    <small>Just install it and play.</small>
  </main>
</body>
</html>
